services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-wise_wizard}:${POSTGRES_PASSWORD:-wise_wizard}@db:5432/${POSTGRES_DB:-wise_wizard}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - sources:/data/sources
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wise_wizard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wise_wizard}
      POSTGRES_DB: ${POSTGRES_DB:-wise_wizard}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db:
  sources:
